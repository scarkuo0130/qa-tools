<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA-Tools</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <form>
            <div class="form-group">
                <label for="environment">環境</label>
                <select id="environment" name="environment">
                    <option value="Prep">Prep</option>
                    <option value="Prod">Prod</option>
                </select>
            </div>
            <div class="form-group">
                <label for="account">Account</label>
                <input type="text" id="account" name="account">
            </div>
            <div class="form-group">
                <label for="game">Game</label>
                <input type="text" id="game" name="game">
            </div>
            <div class="form-group">
                <label for="lang">Lang</label>
                <input type="text" id="lang" name="lang" value="id">
            </div>
            <div class="form-group">
                <label for="token">Token</label>
                <input type="text" id="token" name="token">
            </div>
            <div class="form-group submit-button-container">
                <button type="button" id="submitButton" onclick="handleSubmit()">送出</button>
            </div>
        </form>
    </div>
    <script src="js_compiled/qaFormManager.js"></script>
</body>
</html>
